name: CI

on:
  # Branch pushes are already covered by their pull_request run; only build
  # pushes to the long-lived branches.
  push:
    branches: [master, 'release-*']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to a PR supersedes the previous run. Every other run gets a unique group:
  # a shared group would still cancel pending runs (a group holds at most one running and
  # one pending run), and we want to keep every run on master/release branches.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CXXFLAGS: "-Wall -Wextra -Wno-unused-parameter"

jobs:
  build:
    name: Build
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full OS x build type x compiler cross product exercises the C++ library.
        os: [ubuntu-22.04, ubuntu-24.04]
        orocos_build_type: [Debug, Release]
        compiler: [gcc, clang]
        python_version: ['3.12']
        # The Python version only affects PyKDL, so the remaining supported
        # versions are tested on a single configuration.
        include:
          - os: ubuntu-24.04
            orocos_build_type: Release
            compiler: gcc
            python_version: '3.10'
          - os: ubuntu-24.04
            orocos_build_type: Release
            compiler: gcc
            python_version: '3.11'
          - os: ubuntu-24.04
            orocos_build_type: Release
            compiler: gcc
            python_version: '3.13'
          - os: ubuntu-24.04
            orocos_build_type: Release
            compiler: gcc
            python_version: '3.14'
    env:
      CC: ${{ matrix.compiler }}
      # The project is C++ only; without CXX the clang jobs silently built with g++.
      CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
      OROCOS_KDL_BUILD_TYPE: ${{ matrix.orocos_build_type }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install
        run: |
          sudo apt-get install libeigen3-dev libcppunit-dev
          pip install psutil
      - name: Build orocos_kdl
        run: |
          cd orocos_kdl
          mkdir build
          cd build
          cmake -DENABLE_TESTS:BOOL=ON -DCMAKE_BUILD_TYPE=${OROCOS_KDL_BUILD_TYPE} ./..
          make
          sudo make install
      - name: Check installed headers are self-contained
        run: |
          fail=0
          cd /usr/local/include
          for h in kdl/*.hpp kdl/utilities/*.hpp kdl/utilities/*.h; do
            if ! echo "#include <$h>" | ${CXX} -std=c++17 -I/usr/include/eigen3 -fsyntax-only -x c++ - ; then
              echo "::error::$h is not self-contained"
              fail=1
            fi
          done
          exit $fail
      - name: Build PyKDL
        run: |
          cd python_orocos_kdl
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${OROCOS_KDL_BUILD_TYPE} ./..
          make
          sudo make install
      - name: ldconfig
        run: sudo ldconfig
      - name: Test orocos_kdl
        run: |
          cd orocos_kdl/build
          make check
      - name: Test PyKDL
        run: |
          cd python_orocos_kdl
          python_version_short=$(python -c "import sys; print('{}.{}'.format(sys.version_info[0], sys.version_info[1]))")
          export PYTHONPATH=/usr/local/lib/python${python_version_short}/dist-packages${PYTHONPATH:+:${PYTHONPATH}}
          python tests/PyKDLtest.py

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install
        run: sudo apt-get install lcov libeigen3-dev libcppunit-dev
      - name: Build with coverage instrumentation
        run: |
          cmake -S orocos_kdl -B build -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
      - name: Measure and gate coverage
        run: cmake --build build --target coverage
      - name: Summary
        if: always()
        run: |
          if [ -f build/coverage/kdl.info ]; then
            lcov --summary build/coverage/kdl.info >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/html

  industrial_ci:
    name: Industrial CI - ${{ matrix.env.ROS_DISTRO }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env:
              ROS_DISTRO: noetic
              ROS_REPO: ros
              ABICHECK_URL: github:orocos/orocos_kinematics_dynamics#release-1.5
              ABICHECK_MERGE: false
            branch: release-1.5
          - env:
              ROS_DISTRO: humble
              ROS_REPO: ros
              # Both packages only register their ctest suites when ENABLE_TESTS is on;
              # without this industrial_ci builds but runs 0 tests.
              TARGET_CMAKE_ARGS: -DENABLE_TESTS=ON
            branch: master
          - env:
              ROS_DISTRO: jazzy
              ROS_REPO: ros
              # Both packages only register their ctest suites when ENABLE_TESTS is on;
              # without this industrial_ci builds but runs 0 tests.
              TARGET_CMAKE_ARGS: -DENABLE_TESTS=ON
            branch: master
          - env:
              ROS_DISTRO: rolling
              ROS_REPO: ros
              # industrial_ci derives OS_CODE_NAME from ROS_DISTRO, which points rolling at
              # ubuntu resolute. That dist exists in the ROS 2 apt repository but does not
              # carry ros-rolling-* binaries yet, so setup_rosdep fails before anything is
              # built. Pin to noble until resolute is populated.
              OS_CODE_NAME: noble
              TARGET_CMAKE_ARGS: -DENABLE_TESTS=ON
            branch: master
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
        if: ${{ (github.event_name == 'push' && endsWith(github.ref, matrix.branch)) || (github.event_name == 'pull_request' && endsWith(github.base_ref, matrix.branch)) }}
      - uses: ros-industrial/industrial_ci@master
        env: ${{ matrix.env }}
        if: ${{ (github.event_name == 'push' && endsWith(github.ref, matrix.branch)) || (github.event_name == 'pull_request' && endsWith(github.base_ref, matrix.branch)) }}
